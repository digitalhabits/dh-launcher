name: DHLauncher

# Placeholders the owner replaces before any device or App Store build:
#   BUNDLE_PREFIX   -> real reverse-DNS prefix
#   DEVELOPMENT_TEAM -> Apple developer team ID (empty works for simulator builds)
#   APP_DISPLAY_NAME -> final app name
# The App Group is derived from BUNDLE_PREFIX ("group.<prefix>").

options:
  bundleIdPrefix: org.example.dhlauncher
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    BUNDLE_PREFIX: org.example.dhlauncher
    APP_DISPLAY_NAME: DH Launcher
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LauncherCore:
    path: LauncherCore

targets:
  Launcher:
    type: application
    platform: iOS
    sources:
      - Launcher
    dependencies:
      - package: LauncherCore
      - target: LauncherWidget
        embed: true
    info:
      path: Launcher/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_PREFIX)
        # No encryption beyond what iOS itself provides (the app makes no network requests),
        # so App Store Connect skips the export-compliance question on each upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_PREFIX)
            CFBundleURLSchemes:
              - dhlauncher
    entitlements:
      path: Launcher/Launcher.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        PRODUCT_NAME: Launcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  LauncherWidget:
    type: app-extension
    platform: iOS
    sources:
      - LauncherWidget
    dependencies:
      - package: LauncherCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LauncherWidget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LauncherWidget/LauncherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widget
        PRODUCT_NAME: LauncherWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  Launcher:
    build:
      targets:
        Launcher: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LauncherCore/LauncherCoreTests
